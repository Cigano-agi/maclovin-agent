# Fontes de Ingestão por Categoria
sources:
  # 1. Ferramentas, Repositórios GitHub & Lançamentos de Apps
  - id: "show-hn-tools"
    name: "Show HN (Repositórios & Novos Apps)"
    ingestion_type: "rss"
    url: "https://hnrss.org/show"
    category: "tools"
    active: true
    timeout_seconds: 15

  - id: "huggingface-models"
    name: "Hugging Face (Modelos & Repositórios de IA)"
    ingestion_type: "rss"
    url: "https://huggingface.co/blog/feed.xml"
    category: "tools"
    active: true
    timeout_seconds: 15

  - id: "simon-willison-tools"
    name: "Simon Willison Tools & AI"
    ingestion_type: "rss"
    url: "https://simonwillison.net/atom/everything/"
    category: "tools"
