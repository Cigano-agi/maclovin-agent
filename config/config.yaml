version: "1.0"

# Configurações Globais
settings:
  timezone: "America/Sao_Paulo"
  output_dir: "briefings"
  database_path: "data/maclovin.db"
  log_level: "INFO"
  web_port: 8000

# Configuração do Provedor de Inteligência Artificial (LLM)
ai:
  provider: "gemini"                # gemini, nvidia, openai, ollama
  model: "gemini-2.5-flash"         # Modelo padrão
  temperature: 0.1                  # Baixa temperatura para estrita fidelidade factual
  timeout_seconds: 30

# Tópicos de Interesse do Usuário
topics:
  - id: "ai-tools"
    name: "🛠️ Radar de Ferramentas (Repositórios GitHub & Apps)"
    keywords:
      - "Tool"
      - "Ferramenta"
      - "App"
      - "Software"
      - "Open Source"
      - "GitHub"
      - "Repository"
      - "Repositório"
      - "Release"
      - "Launch"
      - "Pricing"
      - "Free"
      - "Grátis"
      - "Freemium"
      - "Paid"
      - "Library"
      - "Framework"
      - "SaaS"
      - "Extension"
      - "Model"
    active: true
    priority: 1

  - id: "tech-business"
    name: "💼 Business, Startups & Investimentos"
    keywords:
      - "Startup"
      - "Startups"
      - "Venture Capital"
      - "VC"
      - "Funding"
      - "Investimento"
      - "Aporte"
      - "Valuation"
      - "M&A"
      - "Aquisição"
      - "Acquisition"
      - "IPO"
      - "Rodada"
      - "Série A"
      - "Série B"
      - "Seed"
      - "Receita"
      - "Faturamento"
      - "Lucro"
      - "Layoff"
      - "Demissões"
      - "Unicórnio"
      - "Fintech"
    active: true
    priority: 1

  - id: "ai-ml"
    name: "📰 Notícias & Mercado de IA"
    keywords:
      - "Inteligência Artificial"
      - "Artificial Intelligence"
      - "AI"
      - "LLM"
      - "Machine Learning"
      - "OpenAI"
      - "DeepSeek"
      - "Anthropic"
      - "Google Gemini"
      - "ChatGPT"
      - "Claude"
      - "Meta"
      - "Nvidia"
    active: true
    priority: 1

  - id: "tech-learning"
    name: "📚 Aprender Tecnologia & Deep Dives"
    keywords:
      - "Tutorial"
      - "Guide"
      - "Guia"
      - "Architecture"
      - "Arquitetura"
      - "Deep Dive"
      - "Paper"
      - "How to"
      - "Como funciona"
      - "Engenharia"
      - "Engineering"
      - "Benchmark"
      - "Database"
      - "System Design"
      - "Python"
      - "JavaScript"
      - "Rust"
      - "Golang"
      - "Code"
