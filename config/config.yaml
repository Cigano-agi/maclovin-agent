version: "1.0"

# Configurações Globais
settings:
  timezone: "America/Sao_Paulo"
  output_dir: "briefings"
  database_path: "data/maclovin.db"
  log_level: "INFO"
  web_port: 8000

# Configuração do Provedor de Inteligência Artificial (LLM)
ai:
  provider: "gemini"                # gemini, nvidia, openai, ollama
  model: "gemini-2.5-flash"         # Modelo padrão
  temperature: 0.1                  # Baixa temperatura para estrita fidelidade factual
  timeout_seconds: 30

# Tópicos de Interesse do Usuário
topics:
  - id: "ai-tools"
    name: "🛠️ Ferramentas & Lançamentos (Grátis & Pagos)"
    keywords:
      - "Tool"
      - "Ferramenta"
      - "App"
      - "Software"
      - "Open Source"
      - "GitHub"
      - "Release"
      - "Launch"
      - "Pricing"
      - "Free"
      - "Grátis"
      - "Freemium"
      - "Paid"
      - "Library"
      - "Framework"
      - "SaaS"
      - "Extension"
      - "Model"
    active: true
    priority: 1

  - id: "ai-ml"
    name: "📰 Notícias de IA, Startups & Mercado"
    keywords:
      - "Inteligência Artificial"
      - "Artificial Intelligence"
      - "AI"
      - "LLM"
      - "Machine Learning"
      - "OpenAI"
      - "DeepSeek"
      - "Anthropic"
      - "Google Gemini"
      - "ChatGPT"
      - "Claude"
      - "Meta"
      - "Nvidia"
      - "Startup"
    active: true
    priority: 1

  - id: "tech-learning"
    name: "📚 Aprender Tecnologia & Deep Dives"
    keywords:
      - "Tutorial"
      - "Guide"
      - "Guia"
      - "Architecture"
      - "Arquitetura"
      - "Deep Dive"
      - "Paper"
      - "How to"
      - "Como funciona"
      - "Engenharia"
      - "Engineering"
      - "Benchmark"
      - "Database"
      - "System Design"
      - "Python"
      - "JavaScript"
      - "Rust"
      - "Golang"
      - "Code"
    active: true
    priority: 1

  - id: "geek-culture"
    name: "🎮 Universo Geek, HQs, Lançamentos, Obras & Pop"
    keywords:
      - "HQ"
      - "Quadrinho"
      - "Comic"
      - "Mangá"
      - "Manga"
      - "Anime"
      - "Filme"
      - "Movie"
      - "Série"
      - "Series"
      - "Trailer"
      - "Lançamento"
      - "Obra"
      - "Livro"
      - "Book"
      - "Sci-Fi"
      - "Ficção Científica"
      - "Marvel"
      - "DC"
      - "Batman"
      - "Game"
      - "Jogo"
      - "PlayStation"
      - "Xbox"
      - "Nintendo"
      - "Steam"
      - "Hardware"
      - "GPU"
      - "Ciência"
      - "Science"
      - "Espaço"
    active: true
    priority: 1

# Fontes de Ingestão por Categoria
sources:
  # 1. Ferramentas, Modelos & Repositórios
  - id: "huggingface-blog"
    name: "Hugging Face Blog & Models"
    ingestion_type: "rss"
    url: "https://huggingface.co/blog/feed.xml"
    category: "tools"
    active: true
    timeout_seconds: 15

  - id: "simon-willison-ai"
    name: "Simon Willison AI & Tools"
    ingestion_type: "rss"
    url: "https://simonwillison.net/atom/everything/"
