    priority: 1

  - id: "geek-culture"
    name: "🎮 Universo Geek, HQs, Lançamentos, Obras & Pop"
    keywords:
      - "HQ"
      - "Quadrinho"
      - "Comic"
      - "Mangá"
      - "Manga"
      - "Anime"
      - "Filme"
      - "Movie"
      - "Série"
      - "Series"
      - "Trailer"
      - "Lançamento"
      - "Obra"
      - "Livro"
      - "Book"
      - "Sci-Fi"
